<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi delirio tiene referencias bibliográficas</title>
<style>
:root{color-scheme:dark;--bg:#07070c;--ink:#d9d4cc;--warm:#f2e9dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;font-family:ui-monospace,Menlo,Consolas,monospace}
canvas#a{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
canvas#g{position:fixed;left:0;bottom:0;width:100%;height:32vh;opacity:0;transition:opacity 2.5s;z-index:1}
#heading{display:block;margin:0 0 10px;color:var(--warm);font-size:clamp(21px,4vw,36px);font-weight:400;line-height:1.25;letter-spacing:.035em;text-align:left;text-shadow:0 0 12px rgba(255,235,200,.25)}
#sub{display:block;margin:0 0 26px;color:#9d968b;font-size:clamp(13px,2.2vw,17px);font-weight:400;font-style:italic;line-height:1.4;letter-spacing:.04em}
#panel{position:fixed;left:50%;transform:translateX(-50%);width:min(780px,92vw);top:8vh;bottom:31vh;box-sizing:border-box;padding:22px 28px 34px;overflow-y:auto;overflow-x:hidden;white-space:pre-wrap;color:var(--ink);font-size:15px;line-height:1.7;opacity:0;transition:opacity 2s ease;scrollbar-width:thin;scrollbar-color:rgba(210,195,175,.55) rgba(255,255,255,.06);z-index:3;overscroll-behavior:contain; -webkit-overflow-scrolling:touch}
#panel::-webkit-scrollbar{width:7px}
#panel::-webkit-scrollbar-track{background:rgba(255,255,255,.06);border-radius:8px}
#panel::-webkit-scrollbar-thumb{background:rgba(210,195,175,.48);border-radius:8px}
#panel::-webkit-scrollbar-thumb:hover{background:rgba(235,220,200,.78)}
.glow{animation:g 2.4s ease-in-out}
@keyframes g{0%,100%{text-shadow:none}40%{text-shadow:0 0 6px currentColor,0 0 18px currentColor,0 0 36px currentColor}}
.all{animation:ga 3s ease-in-out}
@keyframes ga{0%,100%{text-shadow:none}45%{text-shadow:0 0 8px rgba(255,240,220,.55),0 0 22px rgba(160,190,255,.35)}}
@media(max-width:600px){
 #panel{width:94vw;top:5vh;bottom:28vh;padding:18px 17px 28px;font-size:14px;line-height:1.65}
 #heading{font-size:clamp(20px,6vw,29px)}
 #sub{margin-bottom:21px}
 #rp{top:calc(8px + env(safe-area-inset-top,0px));right:8px}
}
#rp{position:fixed;right:12px;top:calc(10px + env(safe-area-inset-top,0px));background:none;border:1px solid #333;color:#777;font:12px ui-monospace,monospace;padding:4px 9px;border-radius:4px;cursor:pointer;z-index:5}
#rp:hover{color:#ccc;border-color:#666}
</style></head>
<body>
<canvas id="g"></canvas><canvas id="a"></canvas>
<div id="panel"></div>
<button id="rp">↻ repetir</button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const TITLE='Mi delirio tiene referencias bibliográficas';
const SUBTITLE='Los campos léxicos no son tus sueños en colores.';
const TEXT=`La crueldad es un placer natural.
Yo poseo varios placeres. Uno de ellos, el más silente, el más devoto, está hecho para crear. Según el psicoanálisis, mis ganas de pintar o dibujar podrían ser una forma de sublimación: el destino de una pulsión que encuentra satisfacción en otro objeto, en otra actividad, en otra forma de placer.
Así encuentro alivio: transformo el filo en trazo, la herida en imagen.
Sencillo, ¿o no?
Pero entonces viene Fromm y nos recuerda que hasta el más cruel sigue siendo tan humano como un santo; que la destructividad también puede convertirse en una forma de relación con el mundo, una manera de ejercer dominio, de escapar de la impotencia, de encontrar alivio en el sufrimiento ajeno.
¿Entonces qué? ¿No tendríamos todos la misma oportunidad de buscar placer, de encontrar alivio, de alcanzar, por fin, la mítica felicidad?
¡Ja! Déjenme pensarlo una vez más.
La destructividad no cabe en esos absurdos métodos terapéuticos que confunden la cura con la supresión, el tratamiento con el silenciamiento de la conducta.
Hoy, la pregunta no es cómo extirpar lo primitivo, sino cómo comprender las condiciones que mantienen aquello que llamamos destructividad. Cómo modificar sus contingencias, cómo construir otras formas de relación con el entorno.
¿Sublimarlo? ¿O aprender a bailar con él?
Hablemos de las pulsiones.
Mis pulsiones nocturnas, o, como diría el señor Lacan, ese eco en el cuerpo del hecho de que hay un decir, son las regiones oscuras desde las que divago sobre deseos, sueños y delirios.
Una alucinación del porvenir, cuando el deseo importuna al cuerpo y lo convierte en territorio de necesidad.
La noche pasada buscaba melodías de arpegios oscuros en el asqueroso YouTube.
Mi corazón latía con mayor intensidad. Pensaba en el Eros fantasma, en las personalidades proteicas que se multiplicaban en mi imaginación. Escapé de mi mirada a través del espejo… ¿o fue de mi propia imagen?
Me tranquilicé pensando en la percepción como una construcción, en el engaño como posibilidad del sistema perceptivo.
Pero ¡oh, satánica desmesura de mis pensamientos! Descubrí unas fauces oscuras que me observaban desde la pared.

Dibujé todo.
Después, interpreté:

¡Sí, es la muerte! ¡La maldita, planea mi muerte! La descubrí bajo mi cama, intentando inducirme al sueño profundo.
Pero no conoce mi plan. No sabe que la he visto.
Yo haré la sublimación de sus huesos y de mis sueños. Más que fragmentos, la convertiré en humo.

Así fue como pensé aquella noche. Y según las teorías de los crueles, los narcisistas, los sádicos, los obsesivos, los parricidas… esos sujetos clasificados como enfermos mentales no serían más que una colección de humanos cuyas formas de encontrar placer, alivio y satisfacción resultan extrañas, dolorosas o incomprensibles para quienes establecen las fronteras de la normalidad. Pero quizá me equivoque. Quizá no todo pueda sublimarse. Quizá no toda destructividad encuentre un trazo. Y quizá el problema nunca haya sido la existencia de nuestros placeres, sino las condiciones en las que aprendemos a obtenerlos.`;

// Campos léxicos: color tenue, raíces para el texto, palabras para el mar
const FD={
 psi:{c:'#b7a4f0',s:['psicoanális','pulsi','sublim','Lacan','Fromm','deseo','placer','alivio','satisfacci','Eros','fantasma','necesidad','felicidad'],w:['psicoanálisis','pulsión','sublimación','Lacan','Fromm','deseo','placer','alivio','Eros','fantasma','necesidad','desire','désir','Lust','piacere','inconscient']},
 vio:{c:'#e09a9a',s:['crueldad','cruel','filo','herida','destructiv','sádic','parricida','dominio','impotencia','sufrimiento','huesos'],w:['crueldad','filo','herida','destructividad','sádicos','parricidas','dominio','impotencia','sufrimiento','huesos','cruauté','Grausamkeit','wound','Wunde','blessure','crudeltà','Knochen']},
 osc:{c:'#7fb8cc',s:['muerte','noche','nocturn','fauces','humo','sueño','oscur','delirio','alucinaci','satánic','cama'],w:['muerte','noche','fauces','humo','sueño','oscuros','delirio','alucinación','cama','sombra','death','mort','Tod','morte','night','nuit','Nacht','notte','dream','rêve','Traum','smoke','Rauch','fumée']},
 art:{c:'#e2c585',s:['pintar','dibuj','trazo','imagen','melodías','arpegios','espejo','percepci','engaño'],w:['trazo','dibujar','pintar','imagen','espejo','arpegios','melodías','percepción','engaño','mirror','miroir','Spiegel','trait','Bild','dessin']},
 nor:{c:'#92cfa4',s:['normalidad','enfermos','obsesivos','narcisistas','terapéutic','conducta','contingencias','supresi','tratamiento'],w:['normalidad','enfermos','obsesivos','narcisistas','conducta','contingencias','terapia','cura','frontera','normal','Norm','folie','Wahn']}
};
const re=new RegExp('(?<![\\p{L}])('+Object.values(FD).flatMap(f=>f.s).join('|')+')[\\p{L}]*','giu');
const fieldOf=w=>Object.keys(FD).find(k=>FD[k].s.some(s=>w.toLowerCase().startsWith(s.toLowerCase())));
const segs=[];{let l=0,m;while((m=re.exec(TEXT))){if(m.index>l)segs.push({t:TEXT.slice(l,m.index)});segs.push({t:m[0],f:fieldOf(m[0])});l=re.lastIndex}if(l<TEXT.length)segs.push({t:TEXT.slice(l)})}

const CW=8,CH=16,N=900,RAMP=' .:-+*#',SEA=.32;
const cv=document.getElementById('a'),ctx=cv.getContext('2d'),gc=document.getElementById('g'),panel=document.getElementById('panel');
const tmp=document.createElement('canvas'),tctx=tmp.getContext('2d',{willReadFrequently:true});
const rnd=Math.random;let W,H,seaH,cols,rows,dpr,pc0=0,pc1=0;

// ---- Partículas ASCII (three.js ortográfico en baja resolución) ----
const renderer=new THREE.WebGLRenderer({antialias:false,preserveDrawingBuffer:true});
renderer.setPixelRatio(1);renderer.setClearColor(0x000000,1);
const scene=new THREE.Scene(),cam=new THREE.OrthographicCamera(0,1,1,0,-10,10);
const pos=new Float32Array(N*3),col=new Float32Array(N*3),geo=new THREE.BufferGeometry();
geo.setAttribute('position',new THREE.BufferAttribute(pos,3));geo.setAttribute('color',new THREE.BufferAttribute(col,3));
scene.add(new THREE.Points(geo,new THREE.PointsMaterial({size:1,sizeAttenuation:false,vertexColors:true})));
const P=Array.from({length:N},()=>({on:0}));let pi_=0;
function spawn(x,y,vx,vy,c,mode,life,ex){for(let k=0;k<N;k++){const i=(pi_++)%N;if(!P[i].on){Object.assign(P[i],{on:1,x,y,vx,vy,c,mode,life,max:life,ph:rnd()*6},ex||{});return}}}

// ---- Mar 3D de palabras (three.js, perspectiva, shader con reflejos) ----
const sr=new THREE.WebGLRenderer({canvas:gc,antialias:true});sr.setClearColor(0x000000,1);
const sscene=new THREE.Scene(),scam=new THREE.PerspectiveCamera(45,5,.1,700);scam.position.set(0,2.2,0);scam.rotation.x=-.3;
function atlas(){const c=document.createElement('canvas');c.width=2048;c.height=1024;const x=c.getContext('2d');x.textBaseline='middle';
 const all=[];for(const k in FD)FD[k].w.forEach(w=>all.push([w,FD[k].c]));
 for(let i=0;i<300;i++){const [w,cl]=all[(rnd()*all.length)|0],s=20+(rnd()*46|0);x.save();x.translate(rnd()*2048,rnd()*1024);
  x.rotate(rnd()<.25?(rnd()-.5)*3:(rnd()-.5)*.5);x.font=s+'px '+(rnd()<.5?'Georgia,serif':'Arial,sans-serif');x.fillStyle=cl;x.fillText(w,0,0);x.restore()}
 const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=sr.capabilities.getMaxAnisotropy();return t}
const U={uT:{value:0},uHW:{value:3},uCam:{value:scam.position},uTex:{value:atlas()},uR:{value:Array.from({length:16},()=>new THREE.Vector4(0,0,-99,0))}};
const VS=`uniform float uT;uniform float uHW;uniform vec4 uR[16];attribute vec2 aP;varying vec3 vP;varying vec3 vN;
float H(vec2 p){float h=.22*sin(p.x*.9+p.y*.5+uT*1.2)+.16*sin(p.x*.5-p.y*.8-uT*.9)+.07*sin(p.x*2.3+p.y*1.7+uT*2.0);
for(int i=0;i<16;i++){float a=uT-uR[i].z;if(a>0.0&&a<5.0){float r=length(p-uR[i].xy);h+=uR[i].w*exp(-a*.9-r*.18)*sin(r*2.2-a*6.0);}}return h;}
void main(){vec2 q=vec2(aP.x*(aP.y*uHW+8.0),-aP.y);float e=.12;float h=H(q);
vN=normalize(vec3(H(q-vec2(e,0.))-H(q+vec2(e,0.)),2.*e,H(q-vec2(0.,e))-H(q+vec2(0.,e))));
vP=vec3(q.x,h,q.y);gl_Position=projectionMatrix*viewMatrix*vec4(vP,1.0);}`;
const FS=`uniform sampler2D uTex;uniform vec3 uCam;uniform float uT;varying vec3 vP;varying vec3 vN;
void main(){vec3 v=normalize(uCam-vP);float dist=length(uCam-vP);vec3 n=normalize(vN);
vec3 r=reflect(-v,n);vec3 sd=normalize(vec3(0.,.07,-1.));float d=max(dot(r,sd),0.);
float sp=pow(d,200.)*2.0+pow(d,60.)*1.2+pow(d,8.)*.45;
vec4 w=texture2D(uTex,vec2(vP.x*.11+uT*.004,vP.z*.22));
vec3 warm=vec3(1.,.82,.66);vec3 col=vec3(.035,.02,.03)+warm*sp*.5;
col=mix(col,w.rgb*(.22+sp*2.2)+warm*sp*.25,w.a);
float fog=1.-exp(-dist*.016);
vec3 haze=vec3(.30,.19,.14)*(.25+.9*exp(-pow(vP.x/(abs(vP.z)*.55+3.),2.)));
col=mix(col,haze*.7,fog*fog);col*=1.-smoothstep(300.,430.,dist);gl_FragColor=vec4(col,1.);}`;
{const nx=160,nz=300,a=[],ix=[];for(let j=0;j<=nz;j++){const z=2+Math.pow(j/nz,2)*420;for(let i=0;i<=nx;i++)a.push(-1+2*i/nx,z)}
 for(let j=0;j<nz;j++)for(let i=0;i<nx;i++){const p=j*(nx+1)+i,c=p+nx+1;ix.push(p,c,p+1,p+1,c,c+1)}
 const g=new THREE.BufferGeometry();g.setAttribute('aP',new THREE.BufferAttribute(new Float32Array(a),2));
 g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(a.length*1.5),3));g.setIndex(ix);
 const m=new THREE.Mesh(g,new THREE.ShaderMaterial({uniforms:U,vertexShader:VS,fragmentShader:FS}));m.frustumCulled=false;sscene.add(m)}
const rip=Array.from({length:16},()=>({x:0,z:0,t:-99,a:0}));let rpi=0;

function panelCells(){const b=panel.getBoundingClientRect();pc0=Math.floor(b.left/CW);pc1=Math.ceil(b.right/CW)}
function size(){
 W=innerWidth;H=innerHeight;dpr=Math.min(2,devicePixelRatio||1);cols=Math.ceil(W/CW);rows=Math.ceil(H/CH);seaH=Math.round(H*SEA);
 cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
 renderer.setSize(cols,rows,false);tmp.width=cols;tmp.height=rows;cam.right=cols;cam.top=rows;cam.updateProjectionMatrix();
 sr.setPixelRatio(Math.min(dpr,1.5));sr.setSize(W,seaH,false);scam.aspect=W/seaH;scam.updateProjectionMatrix();U.uHW.value=Math.tan(.3927)*W/seaH*1.25;panelCells();
}
addEventListener('resize',size);

let st='text',sideOn=false,acc=0,last=0;
function start(){
 P.forEach(p=>p.on=0);rip.forEach(q=>q.t=-99);sideOn=false;
 panel.style.transition='none';panel.style.opacity=0;panel.innerHTML='';panel.scrollTop=0;

 const heading=document.createElement('h1');
 heading.id='heading';
 heading.textContent=TITLE;
 panel.appendChild(heading);

 const sub=document.createElement('p');
 sub.id='sub';
 sub.textContent=SUBTITLE;
 panel.appendChild(sub);

 segs.forEach(s=>{const e=document.createElement('span');e.textContent=s.t;if(s.f)e.style.color=FD[s.f].c;s.el=e;panel.appendChild(e)});
 void panel.offsetWidth;
 panel.style.transition='';
 gc.style.opacity=0;
 requestAnimationFrame(()=>{panel.style.opacity=1;gc.style.opacity=1});
 sideOn=true;
 st='text';
}
document.getElementById('rp').onclick=start;
setInterval(()=>{ // brillos intermitentes en palabras de los campos
 if(st!=='text')return;const fs=segs.filter(s=>s.f);
 for(let i=0;i<3;i++){const s=fs[(rnd()*fs.length)|0];s.el.classList.remove('glow');void s.el.offsetWidth;s.el.classList.add('glow');setTimeout(()=>s.el.classList.remove('glow'),2500)}
},1300);
setInterval(()=>{if(st!=='text')return;panel.classList.remove('all');void panel.offsetWidth;panel.classList.add('all')},7000);

function frame(now){
 requestAnimationFrame(frame);
 const dt=Math.min(.05,(now-(last||now))/1000);last=now;const t=now/1000;
 if(sideOn){acc+=dt*28;while(acc>=1){acc--;let x;
  if(pc0>4){x=rnd()<.5?1+rnd()*(pc0-2):pc1+1+rnd()*(cols-pc1-2)}else x=rnd()*cols;
  spawn(x,rows*.05+rnd()*rows*.9,(rnd()-.5)*1.2,1.2+rnd()*3,[[1,.92,.7],[.7,.9,1],[.8,.7,1],[1,1,1]][(rnd()*4)|0],2,4+rnd()*4)}}
 for(let i=0;i<N;i++){const p=P[i],o=i*3;
  if(!p.on){pos[o+1]=-100;continue}
  if(p.mode===1){p.vy-=26*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
   if(p.vy<0&&p.y<=p.fl){p.on=0;rip[rpi++%16]={x:((p.x*CW/W)*2-1)*p.d*.4142*W/seaH,z:-p.d,t,a:.4+rnd()*.4};pos[o+1]=-100;continue}
   col[o]=p.c[0];col[o+1]=p.c[1];col[o+2]=p.c[2];
  }else{p.life-=dt;if(p.life<=0){p.on=0;pos[o+1]=-100;continue}
   p.x+=(p.vx+Math.sin(t*1.3+p.ph)*.6)*dt;p.y+=p.vy*dt;
   const f=Math.min(1,p.life/p.max*3,(p.max-p.life)*2)*(.55+.45*Math.sin(t*6+p.ph));
   col[o]=p.c[0]*f;col[o+1]=p.c[1]*f;col[o+2]=p.c[2]*f}
  pos[o]=p.x;pos[o+1]=p.y;pos[o+2]=0}
 geo.attributes.position.needsUpdate=true;geo.attributes.color.needsUpdate=true;
 renderer.render(scene,cam);tctx.drawImage(renderer.domElement,0,0);
 const data=tctx.getImageData(0,0,cols,rows).data;
 ctx.clearRect(0,0,W,H);ctx.font='13px ui-monospace,Menlo,Consolas,monospace';ctx.textBaseline='top';
 for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){const i=(y*cols+x)*4,R=data[i],G=data[i+1],B=data[i+2],m=Math.max(R,G,B)/255;
  if(m<.08)continue;ctx.fillStyle=`rgb(${R},${G},${B})`;ctx.fillText(RAMP[Math.min(RAMP.length-1,(m*RAMP.length)|0)],x*CW,y*CH)}
 U.uT.value=t;for(let i=0;i<16;i++){const q=rip[i];U.uR.value[i].set(q.x,q.z,q.t,q.a)}
 sr.render(sscene,scam);
}
size();start();requestAnimationFrame(frame);
</script>
</body></html>
